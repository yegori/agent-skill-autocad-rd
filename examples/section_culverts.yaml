# Паспорт раздела (пример: водопропуски Архыз). Место: <раздел>\_claude\section.yaml
# Всё, чего здесь нет, берётся из паспорта проекта.
раздел: Водопропуски
telegram:
  группы: []                 # /bind Водопропуски — если у раздела своя группа

сооружения:
  В-4А-1: { ИЗ: ИЗ1,  трасса: T4A }
  В-4А-2: { ИЗ: ИЗ2,  трасса: T4A }
  В-4А-3: { ИЗ: ИЗ3,  трасса: T4A }
  В-5А-1: { ИЗ: ИЗ10, трасса: T5A }
  В-5А-2: { ИЗ: ИЗ11, трасса: T5A }
  В-5А-3: { ИЗ: ИЗ12, трасса: T5A }
  В-5А-4: { ИЗ: ИЗ13, трасса: T5A }
  # папка сооружения = код (по умолчанию)

штамп:
  файл: "Внешние_ссылки/штамп.dwg"
  наименование: "Водоотведение. \\PГорнолыжная трасса {трасса}.\\PВодопропускное сооружение {код}"
  handle_наименование: "157"
  handle_шифр: "15B"

номер_листа:                 # F2: где искать номер (по порядку)
  - { тип: атрибут, блок: Name, тег: НАИМЕНОВАНИЕ }   # обычно поле $(substr,$(getvar,dwgname),1,3)
  - { тип: текст }                                    # иначе цифры в графе «Лист»

ведомость_листов:            # S1 и имена PDF; {код} подставится
  1: Общие данные
  2: "Водопропускное сооружение {код}. Схема расположения"
  3: "Водопропускное сооружение {код}. Продольный профиль"
  4: "Схема котлована {код}"
  5: "Картограмма земляных масс котлована {код}"
  6: "Крепление выходное КВ-1 водопропуска {код}"
  7: "Схема устройства защиты откосов водопропуска {код}"
  8: "Колодец К-1 водопропуска {код}"
листы_обязательные: [1, 3, 4, 5, 8]   # остальные — 🟡 «листа пока нет», если в ведомости есть

исключения:
  В-5А-1:                    # монолитный колодец Км-1, свой состав
    ведомость_листов:
      2: "Водопропускное сооружение В-5А-1. Схема расположения. Разрез А-А"
      3: "Схема котлована В-5А-1"
      4: "Картограмма земляных масс котлована В-5А-1"
      5: "Водопропускное сооружение В-5А-1. Колодец монолитный Км-1"
    доп_листы:
      - { файл: "КЖИ (ЗД-1).dwg", pdf: "ЗД-1 Закладная деталь.pdf", в_сводный: конец }

ОД:
  образец: "В-5А-2/2026.10.14 - 01_B590.110504.1.6-ИЗ11/DWG/001 ОД.dwg"
  генератор: "_claude/скрипты/gen_od.py"
  согласование: группа       # утверждает любой участник группы объекта

проверки:
  включены: [S1, S2, S3, S4, S5, F1, F2, F3, F4, P1, P2, P3, C1, C2, C3]
  предупреждения_блокируют: да

# Паспорт проекта (пример: Архыз ВО, РД 1 этап). Место: <проект>\_claude\project.yaml
проект: Архыз ВО, РД 1 этап
шифр_маска: "01/B590.110504.1.6-ИЗ{n}"        # B — латинская

telegram:
  группы: []                 # заполняется командой /bind Архыз в группе объекта
  управление: [000000000]    # белый список Telegram ID (правки, подтверждение 🟡, очередь)

сооружения_коды: "В-[45]А-\\d|Уч\\.\\s?[45][АВ]-\\d"   # для C1: всё, что выглядит как код сооружения

нормативы_замены:            # C2: неверно -> верно
  "ГОСТ 34027-2016": "ГОСТ 34028-2016"

термины_замены:              # C3: решения по проекту
  "фр(акции|\\.)?\\s*120\\s*[-–]\\s*150": "ср. размер 150"
  "цементно-грунтовой": "цементно-песчаной"

печать:
  плоттер: "DWG To PDF.pc3"
  форматы_добавлять: да      # P1: недостающие UserDefinedMetric добавлять в PMP

выдача:
  папка: "{дата} - 01_B590.110504.1.6-{ИЗ}"
  итерация: "{папка} (испр.{N})"
  подпапки: [DWG, PDF, "PDF/по листам"]
  pdf_имя: "{NNN} {наименование}.pdf"
  сводный: "01_В590_110504_1_6_{ИЗ}.pdf"     # обложка+титул (2 стр.) + листы
  обложка_страниц: 2
